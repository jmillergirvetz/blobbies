<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="none"/>
  
  <!-- Blobby Base -->
  <path d="M64,20 C90,20 106,45 106,70 C106,95 90,110 64,110 C38,110 22,95 22,70 C22,45 38,20 64,20 Z" fill="#1A202C" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Suit Jacket (Navy Pinstripe) -->
  <path d="M 24 75 Q 64 115 104 75 L 102 100 Q 64 112 26 100 Z" fill="#1A365D" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 40 85 L 35 105 M 50 90 L 48 108 M 80 90 L 82 108 M 90 85 L 95 105" fill="none" stroke="#A0AEC0" stroke-width="1"/>
  
  <!-- Shirt Collar -->
  <path d="M 54 75 L 61 75 L 64 82 Z" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 74 75 L 67 75 L 64 82 Z" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
  
  <!-- Tie (AP Red) -->
  <path d="M 61 78 L 64 90 L 67 78 Z" fill="#FF322E"/>

  <!-- Eyes & Smile -->
  <circle cx="50" cy="55" r="4" fill="#FFFFFF"/>
  <circle cx="78" cy="55" r="4" fill="#FFFFFF"/>
  <path d="M56,65 Q64,72 72,65" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Long AP Microphone Handle -->
  <rect x="60" y="70" width="8" height="42" fill="#A0AEC0" rx="1"/>
  <!-- Mic Head -->
  <circle cx="64" cy="70" r="8" fill="#4A5568"/>
  <!-- Mic Flag -->
  <rect x="53" y="78" width="22" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="55" y="90" width="18" height="3" fill="#FF322E"/>
  <text x="64" y="87.5" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">AP</text>

  <!-- Left Sleeve (Navy) -->
  <path d="M 32 80 Q 40 105 58 105" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M 32 80 Q 40 105 58 105" fill="none" stroke="#1A365D" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Right Sleeve (Navy) -->
  <path d="M 96 80 Q 88 105 70 105" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M 96 80 Q 88 105 70 105" fill="none" stroke="#1A365D" stroke-width="6" stroke-linecap="round"/>

  <!-- Hands -->
  <circle cx="58" cy="105" r="5" fill="#1A202C" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="70" cy="105" r="5" fill="#1A202C" stroke="#FFFFFF" stroke-width="2"/>
</svg>
